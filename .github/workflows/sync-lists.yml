name: sync-lists

# Holt die Google-Maps-Listen und veroeffentlicht sie als JSON unter docs/.
# GitHub Pages muss dafuer auf "Deploy from a branch", Branch main, Ordner
# /docs stehen.
#
# Der Job schlaegt fehl, wenn eine Liste nicht abrufbar war oder die Sperre in
# build.mjs angesprungen ist. Der alte Stand bleibt dann veroeffentlicht - das
# ist Absicht: eine leere Liste wuerde die Favoriten auf dem Geraet loeschen.

on:
  # GitHub rechnet Cron in UTC und kennt keine Sommerzeit. Die Zeiten in den
  # Kommentaren sind MEZ (UTC+1); von Ende Maerz bis Ende Oktober liegt jeder
  # Lauf daher eine Stunde spaeter in der Ortszeit - aus 01:17 MEZ wird
  # 02:17 MESZ.
  #
  # Mehrere Slots sind Absicht: ein einzelner Slot haengt daran, dass GitHub
  # genau dieses eine schedule-Event zustellt, und die Zustellung ist
  # ausdruecklich nicht garantiert - unter Last werden Events verworfen. Faellt
  # einer aus, holt der naechste den Sync nach. Der Lauf ist idempotent und
  # dauert rund eine Minute; ohne Inhaltsaenderung entsteht kein Commit.
  #
  # Die Minute 17 steht weiter schief zur vollen Stunde: dort ist die Last bei
  # GitHub am hoechsten und die Wahrscheinlichkeit, verworfen zu werden,
  # entsprechend groesser.
  schedule:
    - cron: "17 0 * * *"        # 01:17 MEZ - nachts
    - cron: "17 7-19/2 * * *"   # 08:17 bis 20:17 MEZ, alle zwei Stunden
  workflow_dispatch:
  repository_dispatch:
    types: [mobile_trigger]

permissions:
  contents: write

concurrency:
  group: sync-lists
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Abhaengigkeiten
        working-directory: tools/backend
        run: npm install --no-audit --no-fund

      - name: Chromium
        working-directory: tools/backend
        run: npx playwright install --with-deps chromium

      - name: Tests
        working-directory: tools/backend
        run: npm test

      # Ein Fehlschlag einzelner Listen darf den Lauf nicht hier beenden -
      # build.mjs braucht die Ergebnisse der uebrigen und entscheidet danach.
      - name: Listen auslesen
        working-directory: tools/backend
        continue-on-error: true
        env:
          LIST_URLS: ${{ secrets.LIST_URLS }}
        run: node scrape.mjs

      - name: JSON erzeugen
        id: build
        working-directory: tools/backend
        continue-on-error: true
        env:
          LIST_SALT: ${{ secrets.LIST_SALT }}
        run: node build.mjs

      # Damit auf einen Blick sichtbar ist, was tatsaechlich rausging - ein
      # leeres "l" bedeutet, dass keine Liste durchkam.
      - name: Zusammenfassung
        if: always()
        run: |
          {
            echo "### Veroeffentlichter Katalog"
            echo ""
            if [ -f docs/index.json ]; then
              echo '```json'
              cat docs/index.json
              echo '```'
            else
              echo "docs/index.json wurde nicht erzeugt."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # docs/ fehlt, wenn schon der Abruf gescheitert ist - dann gibt es hier
      # nichts zu tun, und "git add docs" wuerde nur mit einem Pfadfehler
      # abbrechen und den echten Grund verdecken.
      #
      # Der Push kann abgelehnt werden, wenn main sich seit dem Checkout bewegt
      # hat - waehrend eines Laufs gepusht, oder ein zweiter Lauf war schneller.
      # Der Commit betrifft nur docs/, also wird er auf den neuen Stand
      # umgehaengt und der Push wiederholt, statt den Lauf scheitern zu lassen.
      #
      # "-X theirs" heisst beim Rebase: der gerade erzeugte Katalog gewinnt.
      # Ohne das bleibt der Rebase an index.json haengen, denn die Datei ist
      # eine einzige Zeile - beide Seiten aendern sie zwangslaeufig an
      # derselben Stelle, und ein Zeilenvergleich kann das nicht aufloesen.
      # Dateien, die der andere Lauf angelegt und dieser nicht angefasst hat,
      # bleiben davon unberuehrt.
      - name: Veroeffentlichen
        run: |
          if [ ! -d docs ]; then
            echo "docs/ wurde nicht erzeugt - nichts zu veroeffentlichen"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "keine Aenderung"
            exit 0
          fi
          git commit -m "Listen aktualisiert"
          for versuch in 1 2 3; do
            # Explizites Ziel: der Checkout der Action haengt je nach Ausloeser
            # an einer losen HEAD-Referenz, dann wuesste ein blankes "git push"
            # nicht, wohin.
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push abgelehnt, hole neuen Stand (Versuch $versuch)"
            git fetch origin main
            git rebase -X theirs origin/main || { git rebase --abort; exit 1; }
          done
          echo "Push nach drei Versuchen nicht durchgekommen"
          exit 1

      # always(), sonst haengt an dem if() stillschweigend ein success() und der
      # Schritt faellt genau dann aus, wenn zusaetzlich das Veroeffentlichen
      # gescheitert ist - also dann, wenn man den Grund am dringendsten braucht.
      - name: Ergebnis durchreichen
        if: always() && steps.build.outcome != 'success'
        run: |
          echo "::error::Mindestens eine Liste wurde nicht veroeffentlicht - siehe Schritt 'JSON erzeugen'."
          exit 1
